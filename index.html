<!DOCTYPE html>
<html lang="vi">

<!-- =========================
BLOCK 1: CẤU HÌNH TRANG
========================= -->
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đặt phòng Homestay Hà Nội</title>

<style>

/* =========================
BLOCK 2: CSS GIAO DIỆN
========================= */

body{
font-family: Arial;
background:#f7f7f7;
margin:0;
padding:0;
}

.container{
max-width:420px;
margin:auto;
padding:20px;
margin-top:30px;
}

.card{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

h1{
font-size:22px;
text-align:center;
margin-bottom:20px;
}

label{
display:block;
margin-top:12px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
margin-top:6px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

button{
width:100%;
margin-top:15px;
padding:15px;
border:none;
border-radius:12px;
background:#ff385c;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.result{
margin-top:15px;
text-align:center;
font-weight:bold;
}

textarea{
width:100%;
height:120px;
margin-top:10px;
border-radius:10px;
padding:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Đặt phòng Homestay Hà Nội</h1>

<!-- =========================
BLOCK 3: FORM NHẬP THÔNG TIN
========================= -->

<form id="bookingForm">

<label>Tên khách</label>
<input type="text" id="ten" required>

<label>Check-in</label>
<input type="date" id="checkin" required>

<label>Check-out</label>
<input type="date" id="checkout" required>

<label>Số khách</label>

<select id="khach">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
</select>

<!-- nơi hiển thị kết quả -->
<div class="result" id="ketqua"></div>

<button type="submit">Kiểm tra phòng</button>

</form>

</div>
</div>

<script>

/* =========================
BLOCK 4: CẤU HÌNH HỆ THỐNG
========================= */

// API lưu dữ liệu vào Google Sheet
const API_URL="https://script.google.com/macros/s/AKfycbyKoQkT0Hdq_ixsYs03Ha1hr-nATncexSfDAn9mroSlVwZHBaEWNmdnMtAXMd_rmuPz/exec";

// số Zalo nhận booking;
const zalo="0365725659";


/* =========================
BLOCK 5: XỬ LÝ SUBMIT FORM
========================= */

const form=document.getElementById("bookingForm");

form.addEventListener("submit",function(e){

e.preventDefault();

/* lấy dữ liệu từ form */

let ten=document.getElementById("ten").value;
let checkin=document.getElementById("checkin").value;
let checkout=document.getElementById("checkout").value;
let khach=document.getElementById("khach").value;


/* =========================
BLOCK 6: TÍNH SỐ ĐÊM
========================= */

let d1=new Date(checkin);
let d2=new Date(checkout);

let nights=(d2-d1)/(1000*60*60*24);

if(nights<=0){
alert("Ngày checkout phải sau checkin");
return;
}


/* =========================
BLOCK 7: LƯU DATA VÀO GOOGLE SHEET
========================= */

fetch(API_URL,{
method:"POST",
mode:"no-cors",
body:JSON.stringify({
ten:ten,
checkin:checkin,
checkout:checkout,
khach:khach,
dem:nights
})
});


/* =========================
BLOCK 8: TẠO NỘI DUNG TIN NHẮN
========================= */

let message=`Xin chào Homestay Hà Nội

Tên: ${ten}
Checkin: ${checkin}
Checkout: ${checkout}
Số khách: ${khach}
Số đêm: ${nights}`;


/* =========================
BLOCK 9: HIỂN THỊ COPY + MỞ ZALO
========================= */

document.getElementById("ketqua").innerHTML=`

<p><b>Thông tin đặt phòng</b></p>

<textarea id="msgbox">${message}</textarea>

<button onclick="copyMsg()">Copy nội dung</button>

<button onclick="openZalo()">Mở Zalo gửi</button>

`;

});


/* =========================
BLOCK 10: COPY NỘI DUNG
========================= */

function copyMsg(){

let text=document.getElementById("msgbox");

text.select();

navigator.clipboard.writeText(text.value);

alert("Đã copy nội dung. Hãy mở Zalo và dán gửi.");

}


/* =========================
BLOCK 11: MỞ ZALO;
========================= */

function openZalo(){

window.location.href="https://zalo.me/"+zalo;

}

</script>

</body>

</html>
