<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Villa Sóc Sơn Retreat</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- HERO BANNER -->

<section class="hero">

<img src="assets/images/homestay-hero.jpg">

<div class="hero-text">

<h1>Villa Sóc Sơn Retreat</h1>

<p>Không gian nghỉ dưỡng riêng tư gần Hà Nội</p>

<a class="btn-book" href="#booking">Đặt phòng ngay</a>

</div>

</section>


<!-- GALLERY -->

<section class="gallery">

<img src="assets/images/homestay1.jpg">
<img src="assets/images/homestay2.jpg">
<img src="assets/images/homestay3.jpg">
<img src="assets/images/homestay4.jpg">

</section>


<!-- TIỆN ÍCH -->

<section class="features">

<div class="feature">🏊 Hồ bơi riêng</div>

<div class="feature">🔥 BBQ ngoài trời</div>

<div class="feature">🌲 View rừng</div>

<div class="feature">🚗 Cách Hà Nội 40 phút</div>

</section>


<!-- VIDEO -->

<section class="video">

<h2>Video trải nghiệm</h2>

<video controls>

<source src="assets/videos/tour.mp4">

</video>

</section>


<!-- FORM BOOKING -->

<section id="booking" class="booking">

<h2>Đặt phòng</h2>

<form id="bookingForm">

<input type="text" placeholder="Tên khách">

<input type="date">

<input type="date">

<select>
<option>1 khách</option>
<option>2 khách</option>
<option>3 khách</option>
<option>4 khách</option>
</select>

<button type="submit">Kiểm tra phòng</button>

</form>

</section>

</body>

</html>
